{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>{{ category }}</h2>
    {% if is_mock %}
    <span class="badge bg-warning text-dark fs-5">Mock Test</span>
    {% endif %}
</div>

<form method="POST">
    {% for q in questions %}
    {% set outer_loop = loop %}
    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-light">
            <strong>Q{{ loop.index }}:</strong> {{ q.question }}
        </div>
        <div class="card-body">
            {% for opt in q.options %}
            <div class="form-check">
                <input class="form-check-input" type="radio" name="q_{% if is_mock %}{{ outer_loop.index0 }}{% else %}{{ q._id }}{% endif %}" id="q_{% if is_mock %}{{ outer_loop.index0 }}_{{ loop.index0 }}{% else %}{{ q._id }}_{{ loop.index0 }}{% endif %}" value="{{ opt }}" required>
                <label class="form-check-label" for="q_{% if is_mock %}{{ outer_loop.index0 }}_{{ loop.index0 }}{% else %}{{ q._id }}_{{ loop.index0 }}{% endif %}">
                    {{ opt }}
                </label>
            </div>
            {% endfor %}
        </div>
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-success btn-lg mb-5">Submit Test</button>
</form>
{% endblock %}
