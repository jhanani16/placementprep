{% extends 'base.html' %}

{% block content %}
<h2 class="mb-4">Aptitude Practice</h2>
<p>Select a category to start practicing:</p>

<div class="row">
    {% for cat in categories %}
    <div class="col-md-4 mb-4">
        <div class="card h-100 shadow-sm">
            <div class="card-body text-center">
                <h5 class="card-title">{{ cat }}</h5>
                <p class="card-text">Practice questions from {{ cat }}.</p>
                <a href="{{ url_for('aptitude.quiz', category=cat) }}" class="btn btn-primary">Start Quiz</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
