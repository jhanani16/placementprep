{% extends 'base.html' %}

{% block content %}
<h2 class="mb-4">Registered Students</h2>

<div class="table-responsive">
    <table class="table table-striped table-hover table-bordered">
        <thead class="table-dark">
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>College</th>
                <th>Department</th>
                <th>Year</th>
                <th>Phone</th>
            </tr>
        </thead>
        <tbody>
            {% for s in students %}
            <tr>
                <td>{{ s.name }}</td>
                <td>{{ s.email }}</td>
                <td>{{ s.college }}</td>
                <td>{{ s.department }}</td>
                <td>{{ s.year }}</td>
                <td>{{ s.phone }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="6" class="text-center">No students found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
